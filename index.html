<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sculpture 3D</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#111;color:#eee;font-family:system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:16px}.card{background:#1c1c1c;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:21px;margin:0 0 12px}label{display:block;margin:10px 0 5px;font-weight:600}
input,button{width:100%;font:inherit;border-radius:10px;border:1px solid #444;padding:12px;background:#262626;color:#fff}
button{margin-top:10px;font-weight:700}button:disabled{opacity:.45}
#preview{display:none;max-width:100%;max-height:280px;margin-top:10px;border-radius:10px}
#view{width:100%;height:430px;background:#090909;border-radius:12px;overflow:hidden}
.status{font-size:14px;margin-top:8px}.ok{color:#9fe39f}.bad{color:#ff9c9c}.muted{color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body><main>
<div class="card">
<h1>Sculpture 3D — diagnostic</h1>
<div id="pageStatus" class="status ok">✓ index.html fonctionne</div>
<div class="status ok" style="font-weight:800">VERSION 7 — GÉNÉRATION DEPUIS L’IMAGE</div>
<div class="status muted">L’image choisie sert maintenant à construire la forme 3D.</div>
<label>Image de référence</label>
<input id="img" type="file" aria-label="Choisir une image">
<div id="imgStatus" class="status muted">Aucune image chargée</div>
<img id="preview" alt="Aperçu">
</div>

<div class="card">
<div class="grid">
<div><label>Hauteur (mm)</label><input id="h" type="number" value="500" min="1"></div>
<div><label>Largeur (mm)</label><input id="w" type="number" value="360" min="1"></div>
<div><label>Profondeur (mm)</label><input id="d" type="number" value="220" min="1"></div>
<div><label>Complexité</label><input id="complex" type="number" value="9" min="4" max="18"></div>
</div>
<button id="regen" disabled>Générer à partir de l’image</button>
<button id="export" disabled>Exporter STL</button>
<div id="threeStatus" class="status muted">Chargement du moteur 3D…</div>
</div>
<div id="view"></div>
</main>

<script>
(function(){
 const input=document.getElementById('img');
 const preview=document.getElementById('preview');
 const status=document.getElementById('imgStatus');

 function msg(t,state){status.textContent=t;status.className='status '+(state===1?'ok':state===-1?'bad':'muted')}
 function load(file){
   if(!file){msg("Aucune image reçue par Chrome.",-1);return}
   msg("Image sélectionnée : "+(file.name||"photo")+" — chargement…",0);
   const u=URL.createObjectURL(file);
   preview.onload=()=>{preview.style.display='block';msg("✓ Image chargée : "+(file.name||"photo"),1);URL.revokeObjectURL(u)};
   preview.onerror=()=>{preview.style.display='none';msg("✗ Image reçue mais non lisible. Essaie JPG ou PNG.",-1);URL.revokeObjectURL(u)};
   preview.src=u;
   try{
     const r=new FileReader();
     r.onload=e=>{try{localStorage.setItem('refImage',e.target.result);localStorage.setItem('refName',file.name||'photo')}catch(_){}};
     r.readAsDataURL(file);
   }catch(_){}
 }
 function selected(e){
   const f=(e.target.files&&e.target.files[0])||(input.files&&input.files[0]);
   load(f);
 }
 input.addEventListener('change',selected,false);
 input.addEventListener('input',selected,false);
 try{
   const saved=localStorage.getItem('refImage');
   if(saved){
     preview.onload=()=>{preview.style.display='block';msg("✓ Image précédente restaurée",1)};
     preview.onerror=()=>{preview.style.display='none';msg("Aucune image chargée",0)};
     preview.src=saved;
   }
 }catch(_){}
})();
</script>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
const status=document.getElementById('threeStatus');
try{
 const THREE=await import('three');
 const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
 const {STLExporter}=await import('three/addons/exporters/STLExporter.js');

 const box=document.getElementById('view');
 const preview=document.getElementById('preview');
 const heightInput=document.getElementById('h');
 const widthInput=document.getElementById('w');
 const depthInput=document.getElementById('d');
 const complexInput=document.getElementById('complex');
 const regenBtn=document.getElementById('regen');
 const exportBtn=document.getElementById('export');

 const scene=new THREE.Scene();
 const camera=new THREE.PerspectiveCamera(42,1,.1,5000);
 camera.position.set(520,350,700);

 const renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 box.appendChild(renderer.domElement);

 const controls=new OrbitControls(camera,renderer.domElement);
 controls.enableDamping=true;

 scene.add(new THREE.HemisphereLight(0xffffff,0x333333,2.2));
 const dl=new THREE.DirectionalLight(0xffffff,2);
 dl.position.set(300,500,400);
 scene.add(dl);

 let sculpture=null;

 function removeOld(){
   if(!sculpture) return;
   scene.remove(sculpture);
   sculpture.traverse(o=>{
     if(o.geometry) o.geometry.dispose();
     if(o.material){
       if(Array.isArray(o.material)) o.material.forEach(m=>m.dispose());
       else o.material.dispose();
     }
   });
   sculpture=null;
 }

 function placeholder(){
   removeOld();
   const H=+heightInput.value,W=+widthInput.value,D=+depthInput.value;
   const mat=new THREE.MeshStandardMaterial({color:0xd9d2c5,roughness:.72});
   sculpture=new THREE.Group();
   const base=new THREE.Mesh(new THREE.SphereGeometry(1,28,18),mat);
   base.scale.set(W*.24,H*.42,D*.30);
   sculpture.add(base);
   scene.add(sculpture);
 }

 function smooth(arr, radius=3){
   return arr.map((_,i)=>{
     let sum=0,n=0;
     for(let j=Math.max(0,i-radius);j<=Math.min(arr.length-1,i+radius);j++){
       if(Number.isFinite(arr[j])){sum+=arr[j];n++;}
     }
     return n?sum/n:arr[i];
   });
 }

 function buildFromImage(){
   if(!preview.complete || !preview.naturalWidth){
     status.className='status bad';
     status.textContent="✗ Choisis d’abord une image et attends qu’elle s’affiche.";
     return;
   }

   status.className='status muted';
   status.textContent='Analyse de l’image et génération 3D…';

   const H=Number(heightInput.value)||500;
   const W=Number(widthInput.value)||360;
   const D=Number(depthInput.value)||220;
   const detail=Math.max(4,Math.min(18,Number(complexInput.value)||9));

   const cw=220, ch=300;
   const c=document.createElement('canvas');
   c.width=cw; c.height=ch;
   const ctx=c.getContext('2d',{willReadFrequently:true});
   ctx.fillStyle='white'; ctx.fillRect(0,0,cw,ch);

   const ir=preview.naturalWidth/preview.naturalHeight;
   const cr=cw/ch;
   let dw,dh,dx,dy;
   if(ir>cr){dw=cw;dh=cw/ir;dx=0;dy=(ch-dh)/2;}
   else{dh=ch;dw=ch*ir;dy=0;dx=(cw-dw)/2;}
   ctx.drawImage(preview,dx,dy,dw,dh);

   const data=ctx.getImageData(0,0,cw,ch).data;
   const rows=[];
   for(let y=0;y<ch;y++){
     let min=cw,max=-1,count=0;
     for(let x=0;x<cw;x++){
       const i=(y*cw+x)*4;
       const a=data[i+3];
       const lum=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];
       if(a>25 && lum<185){
         min=Math.min(min,x); max=Math.max(max,x); count++;
       }
     }
     if(count>=2 && max-min>=2) rows.push({y,min,max});
   }

   if(rows.length<12){
     status.className='status bad';
     status.textContent="✗ Je ne détecte pas assez de forme sombre. Utilise un dessin foncé sur fond clair.";
     return;
   }

   // Garde la zone verticale principale détectée.
   let best=[],cur=[rows[0]];
   for(let i=1;i<rows.length;i++){
     if(rows[i].y-rows[i-1].y<=2) cur.push(rows[i]);
     else { if(cur.length>best.length) best=cur; cur=[rows[i]]; }
   }
   if(cur.length>best.length) best=cur;
   if(best.length<12) best=rows;

   const step=Math.max(1,Math.floor(best.length/(22+detail*3)));
   let sampled=best.filter((_,i)=>i%step===0);
   if(sampled[sampled.length-1]!==best[best.length-1]) sampled.push(best[best.length-1]);

   let centers=sampled.map(r=>(r.min+r.max)/2);
   let widths=sampled.map(r=>r.max-r.min);
   centers=smooth(centers,2);
   widths=smooth(widths,2);

   const minY=sampled[0].y,maxY=sampled[sampled.length-1].y;
   const maxDetected=Math.max(...widths);
   const cxMean=centers.reduce((a,b)=>a+b,0)/centers.length;

   const rings=Math.max(18,24+detail*3);
   const sides=Math.max(24,28+detail*2);
   const pos=[];
   const idx=[];

   function interpolate(arr,t){
     const f=t*(arr.length-1);
     const i=Math.floor(f),j=Math.min(arr.length-1,i+1),u=f-i;
     return arr[i]*(1-u)+arr[j]*u;
   }

   for(let r=0;r<rings;r++){
     const t=r/(rings-1);
     const centerPx=interpolate(centers,t);
     const widthPx=Math.max(2,interpolate(widths,t));
     const xCenter=((centerPx-cxMean)/Math.max(1,maxDetected))*W*.60;
     const rx=(widthPx/maxDetected)*(W*.5);
     const rz=Math.max(D*.035,(widthPx/maxDetected)*(D*.5));
     const y=(t-.5)*H;

     for(let k=0;k<sides;k++){
       const a=k/sides*Math.PI*2;
       const bulge=.92+.08*Math.sin(Math.PI*t);
       pos.push(
         xCenter + Math.cos(a)*rx,
         y,
         Math.sin(a)*rz*bulge
       );
     }
   }

   for(let r=0;r<rings-1;r++){
     for(let k=0;k<sides;k++){
       const nk=(k+1)%sides;
       const a=r*sides+k,b=r*sides+nk,c=(r+1)*sides+k,d=(r+1)*sides+nk;
       idx.push(a,c,b,b,c,d);
     }
   }

   // Capuchons haut/bas pour obtenir un volume fermé.
   const bottomCenter=pos.length/3;
   let bx=0,bz=0;
   for(let k=0;k<sides;k++){bx+=pos[k*3];bz+=pos[k*3+2];}
   pos.push(bx/sides,-H/2,bz/sides);
   const topStart=(rings-1)*sides;
   const topCenter=pos.length/3;
   let tx=0,tz=0;
   for(let k=0;k<sides;k++){tx+=pos[(topStart+k)*3];tz+=pos[(topStart+k)*3+2];}
   pos.push(tx/sides,H/2,tz/sides);

   for(let k=0;k<sides;k++){
     const nk=(k+1)%sides;
     idx.push(bottomCenter,nk,k);
     idx.push(topCenter,topStart+k,topStart+nk);
   }

   const g=new THREE.BufferGeometry();
   g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
   g.setIndex(idx);
   g.computeVertexNormals();

   const mat=new THREE.MeshStandardMaterial({
     color:0xd9d2c5,
     roughness:.72,
     metalness:0,
     side:THREE.DoubleSide
   });

   removeOld();
   sculpture=new THREE.Mesh(g,mat);
   scene.add(sculpture);

   const bounds=new THREE.Box3().setFromObject(sculpture);
   const center=bounds.getCenter(new THREE.Vector3());
   controls.target.copy(center);
   camera.position.set(W*1.15,H*.28,Math.max(W,D)*1.65);
   controls.update();

   status.className='status ok';
   status.textContent='✓ Modèle généré depuis la silhouette de l’image';
 }

 function resize(){
   const w=box.clientWidth,h=box.clientHeight;
   renderer.setSize(w,h,false);
   camera.aspect=w/h;
   camera.updateProjectionMatrix();
 }

 addEventListener('resize',resize);
 resize();
 placeholder();

 regenBtn.disabled=false;
 exportBtn.disabled=false;
 regenBtn.onclick=buildFromImage;

 exportBtn.onclick=()=>{
   if(!sculpture) return;
   const data=new STLExporter().parse(sculpture,{binary:false});
   const url=URL.createObjectURL(new Blob([data],{type:'model/stl'}));
   const a=document.createElement('a');
   a.href=url;
   a.download='sculpture.stl';
   document.body.appendChild(a);
   a.click();
   a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 };

 status.className='status ok';
 status.textContent='✓ Moteur 3D chargé — prêt à analyser l’image';

 (function loop(){
   requestAnimationFrame(loop);
   controls.update();
   renderer.render(scene,camera);
 })();

}catch(e){
 status.className='status bad';
 status.textContent='✗ Moteur 3D non chargé : '+e.message;
}
</script>
</body></html>
